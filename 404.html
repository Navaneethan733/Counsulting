<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 8rem;
      font-weight: 900;
      color: #f9a825;
      animation: bounce 1.5s infinite;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #fff;
    }

    p {
      color: #ccc;
      margin-bottom: 30px;
    }

    a.btn {
      text-decoration: none;
      color: #000;
      background-color: #f9a825;
      padding: 15px 30px;
      border-radius: 6px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    a.btn:hover {
      background-color: #fff176;
    }

    /* Background animation circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #f9a825;
      animation: float 6s infinite ease-in-out;
      opacity: 0.3;
    }

    .circle1 { width: 200px; height: 200px; top: 10%; left: 15%; animation-delay: 0s; }
    .circle2 { width: 300px; height: 300px; top: 60%; left: 70%; animation-delay: 2s; }
    .circle3 { width: 150px; height: 150px; top: 40%; left: 40%; animation-delay: 4s; }

    /* Animations */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
      100% { transform: translateY(0) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>

  <h1>404</h1>
  <h2>Oops! Page Not Found</h2>
  <p>Sorry, the page you are looking for doesn’t exist or has been moved.</p>
  <a href="./index.html" class="btn">Go Back Home</a>
</body>
</html>
